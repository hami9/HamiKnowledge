[project]
name = "hamiknowledge"
version = "0.1.0"
description = "Multi-user RAG workspace with cited answers and measured cost"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hami9" }]
requires-python = ">=3.12"
keywords = ["rag", "multilingual", "evaluation", "pgvector", "reranking"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
models = [
    "torch",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
